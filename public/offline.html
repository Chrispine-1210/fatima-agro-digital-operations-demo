<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d8428">
  <meta name="robots" content="noindex, nofollow">
  <title>Fatima Agro | Reconnect</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #173c29; background: #f5f8f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    main { width: min(100%, 480px); padding: 38px 32px; background: #fff; border: 1px solid #d9e5d4; border-top: 4px solid #1d8428; }
    svg { display: block; width: 72px; height: 72px; margin-bottom: 24px; }
    .brand { margin: 0 0 25px; font-size: 15px; font-weight: 700; letter-spacing: .03em; }
    h1 { margin: 0 0 16px; font-size: clamp(27px, 5vw, 34px); line-height: 1.15; }
    p { margin: 0 0 25px; color: #53665a; font-size: 16px; line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; color: #fff; background: #1d8428; border-radius: 4px; font-size: 16px; font-weight: 700; text-decoration: none; }
    a:hover { background: #176d20; }
    a:focus-visible { outline: 3px solid #173c29; outline-offset: 4px; }
    a.account { margin-left: 12px; padding: 12px 0; color: #1d8428; background: transparent; font-size: 14px; text-decoration: underline; }
    small { display: block; margin-top: 24px; color: #617165; font-size: 12px; line-height: 1.6; }
    @media (max-width: 360px) { main { padding: 28px 22px; } }
  </style>
</head>
<body data-fatima-offline="v1">
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="104 9 1072 1072" role="img" aria-labelledby="offline-logo-title">
      <title id="offline-logo-title">Fatima Agro</title>
      <circle cx="640" cy="545" r="512" fill="#1d8428"/>
      <circle cx="640" cy="545" r="396" fill="#fff"/>
      <g fill="#1d8428" transform="translate(640 545) scale(1.18) translate(-640 -545)">
        <path d="M384 307H584V374H493V496H574V558H493V785H384Z"/>
        <path fill-rule="evenodd" d="M684 307H820L899 785H790L774 658H730L710 785H606Z M751 475L740 586H764Z"/>
      </g>
    </svg>
    <div class="brand">FATIMA AGRO</div>
    <h1>Let's reconnect.</h1>
    <p>An internet connection is needed to sign in, view current records and save work. Reconnect, then open your account to continue.</p>
    <a href="">Try again</a>
    <a class="account" href="/account">Account sign-in</a>
    <small>Kanengo, Lilongwe<br>Growing Together Feeding Tomorrow</small>
  </main>
</body>
</html>
